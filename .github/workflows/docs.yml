name: Deploy Docs

on:
  # 推送到主分支或手动触发
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read      # 读取仓库内容
  pages: write        # 写入 Pages
  id-token: write     # 生成 OIDC 令牌

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      # typedoc 直接读 src/index.ts，不需要先构建
      - name: 构建 API 文档
        run: bun run docs

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
